plugins {
    id 'com.android.application'
}

// ゲーム本体（リポジトリ直下の Web 版）を、ビルドのたびに APK の assets/web へ写す
def webDir = layout.buildDirectory.dir('generated/web')
def copyWeb = tasks.register('copyWeb', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'vendor/**'
    }
    into webDir.map { it.dir('web') }
}
preBuild.dependsOn copyWeb

// リリースの署名鍵（アップロード鍵）は android/keystore.properties に書く。リポジトリには入れない
def keyProps = new Properties()
def keyFile = rootProject.file('keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

// versionCode は main のコミット数（iOS のビルド番号と同じ数え方）。Play には同じ番号を 2 度は送れない
def commitCount = providers.exec {
    commandLine 'git', 'rev-list', '--count', 'HEAD'
}.standardOutput.asText.get().trim().toInteger()

android {
    namespace 'com.kusahaeta.nyanko'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kusahaeta.nyanko'
        minSdk 24
        targetSdk 36
        versionCode commitCount
        versionName '1.0'
    }

    signingConfigs {
        if (keyFile.exists()) {
            release {
                storeFile rootProject.file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    sourceSets {
        main.assets.srcDirs += webDir.get().asFile
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keyFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
