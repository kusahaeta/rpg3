<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Verify replay</title>
<!--
  AI がブラウザでゲームを動かして確かめるところの再現（1920×1080）。左に Claude Code とのやりとり、右にブラウザ。
  右に出すのは、そのとき AI が実際に撮った画面（会話の記録に残っていた画像）。tools/promo/page-rec.mjs が
  setClip(データ) で中身を入れ、render(秒) で撮る。データ：{ date, url, dur?, events: [{ u | a | code | tool | skip, at?, shot? }] }
  code はブラウザで動かした JS（1 行）。shot はその結果として右に出す画像（file:// の URL）。
-->
<style>
  :root { --bg: #f4f1ea; --panel: #fbfaf7; --ink: #26231f; --sub: #77716a; --line: #e2ddd3; --user: #e7e0d2; --accent: #c96442; --ok: #4f8a5b; --code: #2b2926; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; -webkit-font-smoothing: antialiased; }
  header { position: absolute; inset: 0 0 auto 0; height: 96px; display: flex; align-items: center; gap: 20px; padding: 0 56px;
    border-bottom: 2px solid var(--line); background: var(--panel); z-index: 3; }
  header .app { font-size: 32px; font-weight: 700; }
  header .tag { font-size: 21px; color: var(--sub); border: 2px solid var(--line); border-radius: 999px; padding: 5px 16px; }
  header .when { margin-left: auto; font-size: 28px; color: var(--sub); font-variant-numeric: tabular-nums; }
  header .when b { color: var(--ink); font-weight: 600; margin-left: 12px; }
  #left { position: absolute; top: 96px; bottom: 0; left: 0; width: 860px; overflow: hidden; border-right: 2px solid var(--line); }
  #log { position: absolute; left: 48px; right: 40px; top: 0; padding: 36px 0 80px; }
  .item:not(.on) { display: none !important; }
  .u { display: flex; justify-content: flex-end; margin: 22px 0 20px; }
  .u .bubble { max-width: 680px; background: var(--user); border-radius: 22px; padding: 18px 26px; font-size: 30px; line-height: 1.5; }
  .a { position: relative; padding-left: 34px; margin: 16px 0; font-size: 27px; line-height: 1.6; }
  .a::before { content: ""; position: absolute; left: 4px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .c { margin: 10px 0 10px 34px; font-family: "SF Mono", Menlo, monospace; font-size: 21px; color: #f1ede6; background: var(--code);
    border-radius: 10px; padding: 12px 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c .k { color: #8fb8f0; }
  .t { display: flex; gap: 12px; align-items: center; margin: 8px 0 8px 34px; font-size: 23px; color: var(--sub); }
  .t .ic { width: 24px; text-align: center; font-weight: 700; }
  .t.done .ic { color: var(--ok); }
  .s { text-align: center; color: var(--sub); font-size: 23px; margin: 24px 0; letter-spacing: .1em; }
  .caret { display: inline-block; width: 3px; height: 1.1em; background: var(--ink); vertical-align: -0.15em; margin-left: 2px; }
  #right { position: absolute; top: 96px; bottom: 0; left: 860px; right: 0; padding: 40px 48px; }
  .win { position: relative; height: 100%; border-radius: 18px; overflow: hidden; background: #fff; border: 2px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  .bar { height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: #efebe3; border-bottom: 2px solid var(--line); }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #d8d1c4; }
  .url { flex: 1; margin-left: 10px; height: 36px; border-radius: 10px; background: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 20px; color: var(--sub); }
  .view { position: absolute; top: 60px; left: 0; right: 0; bottom: 56px; background: #1d1b19; display: flex; align-items: center; justify-content: center; }
  .view img { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); object-fit: contain; }
  .view .wait { color: #9c958a; font-size: 24px; }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 21px; color: var(--sub); background: #faf8f4; border-top: 2px solid var(--line); }
  .flash { position: absolute; inset: 60px 0 56px 0; background: #fff; pointer-events: none; opacity: 0; }
</style>
</head>
<body>
<header>
  <div class="app">Claude Code</div>
  <div class="tag">実際のやりとりを再現（一部省略）</div>
  <div class="when"><span id="date"></span><b id="clock"></b></div>
</header>
<div id="left"><div id="log"></div></div>
<div id="right"><div class="win">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="url" id="url"></div></div>
  <div class="view" id="view"><div class="wait" id="wait">読みこみ中…</div></div>
  <div class="flash" id="flash"></div>
  <div class="cap">右の画面は、AI がそのとき撮って見ていた画像そのまま</div>
</div></div>
<script>
const TYPE = 16, STREAM = 70, AFTER_U = 0.6, AFTER_A = 0.5, CODE = 0.6, AFTER_C = 0.25, TOOL = 0.6, AFTER_T = 0.2, SKIP = 1.0, SHOT_HOLD = 1.6, HEAD = 0.5, TAIL = 2.0;
let items = [], shots = [], total = 0, scroll = 0, lastT = -1;
const chars = s => Array.from(s);
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

window.setClip = clip => {
  const log = document.getElementById('log'), view = document.getElementById('view');
  log.innerHTML = ''; items = []; shots = []; scroll = 0; lastT = -1;
  view.querySelectorAll('img').forEach(i => i.remove());
  document.getElementById('date').textContent = clip.date;
  document.getElementById('url').textContent = clip.url;
  let t = HEAD;
  for (const e of clip.events) {
    const el = document.createElement('div'); let it;
    if (e.u != null) { el.className = 'item u'; el.innerHTML = '<div class="bubble"></div>';
      const c = chars(e.u), d = c.length / TYPE; it = { kind: 'u', c, t0: t, t1: t + d }; t += d + AFTER_U; }
    else if (e.a != null) { el.className = 'item a'; const c = chars(e.a), d = c.length / STREAM; it = { kind: 'a', c, t0: t, t1: t + d }; t += d + AFTER_A; }
    else if (e.code != null) { el.className = 'item c'; el.innerHTML = esc(e.code).replace(/^(await|const)/, '<span class="k">$1</span>');
      it = { kind: 'c', t0: t, t1: t + CODE }; t += CODE + AFTER_C; }
    else if (e.tool != null) { el.className = 'item t'; el.innerHTML = '<span class="ic"></span><span></span>'; el.lastChild.textContent = e.tool;
      it = { kind: 't', t0: t, t1: t + TOOL }; t += TOOL + AFTER_T; }
    else if (e.skip != null) { el.className = 'item s'; el.textContent = `⋯　${e.skip}　⋯`; it = { kind: 's', t0: t, t1: t + SKIP }; t += SKIP; }
    it.el = el; it.at = e.at || null; log.appendChild(el); items.push(it);
    if (e.shot) { const img = document.createElement('img'); img.src = e.shot; img.style.opacity = 0; view.appendChild(img);
      shots.push({ img, t: it.t1 }); t += SHOT_HOLD; }
  }
  total = t + TAIL;
  return Promise.all(shots.map(s => s.img.decode().catch(() => {}))).then(() => total);
};

window.render = t => {
  let clock = null;
  for (const it of items) {
    const on = t >= it.t0; it.el.classList.toggle('on', on); if (!on) continue;
    if (it.at) clock = it.at;
    const p = Math.min(1, (t - it.t0) / (it.t1 - it.t0));
    if (it.kind === 'u') { const b = it.el.firstChild; b.textContent = it.c.slice(0, Math.round(p * it.c.length)).join('');
      if (p < 1) { const k = document.createElement('span'); k.className = 'caret'; b.appendChild(k); } }
    else if (it.kind === 'a') it.el.textContent = it.c.slice(0, Math.round(p * it.c.length)).join('');
    else if (it.kind === 'c') it.el.style.opacity = p;
    else if (it.kind === 't') { it.el.classList.toggle('done', p >= 1); it.el.querySelector('.ic').textContent = p >= 1 ? '✓' : '◐◓◑◒'[Math.floor(t * 8) % 4]; }
  }
  if (clock) document.getElementById('clock').textContent = clock;
  // 右のブラウザ：いちばん新しい撮った画面を出す。撮った瞬間に白く光らせる
  let cur = -1; shots.forEach((s, i) => { if (t >= s.t) cur = i; });
  shots.forEach((s, i) => s.img.style.opacity = i === cur ? 1 : 0);
  document.getElementById('wait').style.opacity = cur < 0 ? 1 : 0;
  const since = cur < 0 ? 9 : t - shots[cur].t;
  document.getElementById('flash').style.opacity = Math.max(0, 0.7 - since * 3);
  const log = document.getElementById('log'), viewH = document.getElementById('left').clientHeight;
  const target = Math.max(0, log.offsetHeight - viewH);
  const dt = lastT < 0 ? 1 : Math.max(0, t - lastT); lastT = t;
  scroll += (target - scroll) * (1 - Math.pow(0.002, dt));
  log.style.transform = `translateY(${-scroll}px)`;
  return total;
};
</script>
</body>
</html>
