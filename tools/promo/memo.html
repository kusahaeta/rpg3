<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Memory notes</title>
<!--
  Claude Code が自分で残した記憶のメモ（~/.claude/projects/…/memory/）を見せる画面（1920×1080）。
  tools/promo/page-rec.mjs が setClip(データ, 名前) で場面を選び、render(秒) で撮る。データは promo/making-of/memo.json。
    list：目次（MEMORY.md）の行が順に出て、最後に mark の行が光る（mark が配列なら、markEvery 秒ずつずらして光る）
    場面の名前とちがう種類を使うときは kind に書く（例：steps は kind: "list"）
    file：メモ 1 つの中身。mark の文に蛍光ペンを引く
    count：メモのファイル名が格子にならび、数が 20 まで上がる
-->
<style>
  :root { --bg: #f4f1ea; --panel: #fbfaf7; --ink: #26231f; --sub: #77716a; --line: #e2ddd3; --accent: #c96442; --hl: #f7d9a8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; -webkit-font-smoothing: antialiased; }
  .win { position: absolute; left: 140px; right: 140px; top: 120px; bottom: 80px; border-radius: 18px; background: var(--panel);
    border: 2px solid var(--line); overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  .bar { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: #efebe3; border-bottom: 2px solid var(--line); font-size: 24px; color: var(--sub); }
  .bar b { color: var(--ink); font-weight: 600; font-family: "SF Mono", Menlo, monospace; font-size: 23px; }
  .bar .tag { margin-left: auto; font-size: 21px; border: 2px solid var(--line); border-radius: 999px; padding: 4px 16px; background: var(--panel); }
  .body { position: absolute; top: 66px; left: 0; right: 0; bottom: 0; padding: 18px 44px; overflow: hidden; }
  h1 { position: absolute; left: 140px; top: 40px; font-size: 40px; }
  .row { display: flex; gap: 20px; align-items: baseline; font-size: 25px; line-height: 1.2; padding: 5px 14px; border-radius: 10px; white-space: nowrap; overflow: hidden; }
  .row .n { width: 36px; text-align: right; color: var(--sub); font-variant-numeric: tabular-nums; font-size: 22px; flex: none; }
  .row b { font-weight: 700; flex: none; }
  .row em { font-style: normal; color: var(--sub); font-size: 21px; overflow: hidden; text-overflow: ellipsis; }
  .row.mark { background: var(--hl); }
  .text { font-size: 30px; line-height: 1.8; white-space: pre-wrap; }
  .text h2 { font-size: 34px; margin-bottom: 10px; }
  .text .m { background-image: linear-gradient(var(--hl), var(--hl)); background-repeat: no-repeat; background-position: 0 85%; }
  .grid { position: absolute; left: 140px; right: 140px; top: 260px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .chip { height: 128px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); padding: 18px 22px; }
  .chip b { display: block; font-size: 25px; line-height: 1.35; }
  .chip span { display: block; margin-top: 8px; font-family: "SF Mono", Menlo, monospace; font-size: 17px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counter { position: absolute; right: 140px; top: 70px; font-size: 40px; font-weight: 700; }
  .counter b { font-size: 120px; margin-right: 10px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const CLIPS = {
  list(root, d) {
    root.innerHTML = `<div class="win"><div class="bar"><b>memory/MEMORY.md</b><span>Claude Code の記憶のメモ（目次）</span><span class="tag">AI が自分で書いた</span></div><div class="body"></div></div>`;
    const body = root.querySelector('.body');
    const rows = d.entries.map((e, i) => { const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = `<span class="n">${i + 1}</span><b></b><em></em>`; r.children[1].textContent = e.title; r.children[2].textContent = e.hook;
      body.appendChild(r); return r; });
    // mark は光らせるメモの題（いくつかなら配列。markEvery 秒ずつずらして光る）
    const marks = [d.mark].flat().map(m => d.entries.findIndex(e => e.title === m));
    return t => { rows.forEach((r, i) => { const k = ease((t - d.start - i * d.every) / 0.3); r.style.opacity = k; r.style.transform = `translateX(${(1 - k) * 20}px)`; });
      marks.forEach((mi, j) => rows[mi].classList.toggle('mark', t >= d.markAt + j * (d.markEvery ?? 0))); };
  },
  file(root, d) {
    root.innerHTML = `<div class="win"><div class="bar"><b>memory/${d.file}</b><span>${d.title}</span><span class="tag">AI が自分で書いた</span></div><div class="body"><div class="text"></div></div></div>`;
    const tx = root.querySelector('.text');
    const i = d.text.indexOf(d.mark);
    const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
    tx.innerHTML = `<h2>${esc(d.title)}</h2>` + esc(d.text.slice(0, i)) + `<span class="m">${esc(d.mark)}</span>` + esc(d.text.slice(i + d.mark.length));
    const m = tx.querySelector('.m');
    return t => { tx.style.opacity = ease(t / 0.4); m.style.backgroundSize = `${ease((t - d.markAt) / 0.9) * 100}% 45%`; };
  },
  count(root, d) {
    root.innerHTML = `<h1>Claude Code が残したメモ</h1><div class="counter"><b>0</b>こ</div><div class="grid"></div>`;
    const g = root.querySelector('.grid'), num = root.querySelector('.counter b');
    const chips = d.entries.map(e => { const c = document.createElement('div'); c.className = 'chip';
      c.innerHTML = '<b></b><span></span>'; c.firstChild.textContent = e.title; c.lastChild.textContent = e.file; g.appendChild(c); return c; });
    return t => { let n = 0; chips.forEach((c, i) => { const k = ease((t - d.start - i * d.every) / 0.3); if (k > 0.5) n++;
      c.style.opacity = k; c.style.transform = `scale(${0.9 + 0.1 * k})`; }); num.textContent = n; };
  },
};
let draw = () => {}, total = 0;
window.setClip = (data, name) => { const root = document.getElementById('root'); root.innerHTML = ''; draw = CLIPS[data.kind ?? name](root, data); total = data.dur; return total; };
window.render = t => { draw(t); return total; };
</script>
</body>
</html>
