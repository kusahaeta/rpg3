# GitHub Pages にはプライバシーポリシーとサポートのページだけを出す。
# ゲーム本体（index.html・js/ など）はストアのアプリで遊ぶものなので、Pages には置かない。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - privacy.html
      - support.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開する2ページだけを集める
        run: |
          mkdir _site
          cp privacy.html support.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
